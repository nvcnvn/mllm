<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 480 390" width="480" height="390" font-family="Inter, sans-serif">
<g data-node="ane">
<rect x="50" y="10" width="210" height="60" rx="8" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1"/>
<text x="155" y="35" text-anchor="middle" fill="#202124" font-size="14">Neural Engine, ~13 TFLOPS</text>
<text x="155" y="55" text-anchor="middle" fill="#202124" font-size="14">prefill dense blocks only</text>
</g>
<g data-node="cpu">
<rect x="260" y="150" width="180" height="60" rx="8" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1"/>
<text x="350" y="175" text-anchor="middle" fill="#202124" font-size="14">CPU, 14 cores</text>
<text x="350" y="195" text-anchor="middle" fill="#202124" font-size="14">bookkeeping, tokenizer</text>
</g>
<g data-node="gpu">
<rect x="10" y="130" width="210" height="80" rx="8" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1"/>
<text x="115" y="155" text-anchor="middle" fill="#202124" font-size="14">GPU, 7.5 TFLOPS</text>
<text x="115" y="175" text-anchor="middle" fill="#202124" font-size="14">decode, attention, sampling</text>
<text x="115" y="195" text-anchor="middle" fill="#202124" font-size="14">prefill by default</text>
</g>
<g data-node="ram">
<path d="M250 277 L250 353 A100 7 0 0 0 450 353 L450 277 A100 7 0 0 0 250 277 Z" fill="#FEF7E0" stroke="#E37400" stroke-width="1"/>
<path d="M250 277 A100 7 0 0 0 450 277" fill="none" stroke="#E37400" stroke-width="1"/>
<text x="350" y="314" text-anchor="middle" fill="#202124" font-size="14">LPDDR5X, 64 GB, one pool</text>
<text x="350" y="334" text-anchor="middle" fill="#202124" font-size="14">273 GB/s peak</text>
</g>
<g data-edge="ane-gpu">
<path d="M118 70 L118 130" fill="none" stroke="#3C4043" stroke-width="1.5" stroke-dasharray="6 4"/>
<path d="M113 120 L118 130 L123 120" fill="none" stroke="#3C4043" stroke-width="1.5"/>
<rect x="53" y="92" width="130" height="17" fill="#FFFFFF"/>
<text x="118" y="105" text-anchor="middle" fill="#202124" font-size="12">IOSurface, zero-copy</text>
</g>
<g data-edge="ane-ram">
<path d="M190 70 L190 82 L238 82 L238 300 L250 300" fill="none" stroke="#3C4043" stroke-width="1.5"/>
<path d="M240 305 L250 300 L240 295" fill="none" stroke="#3C4043" stroke-width="1.5"/>
<rect x="183" y="101" width="110" height="17" fill="#FFFFFF"/>
<text x="238" y="114" text-anchor="middle" fill="#202124" font-size="12">~39 GB/s weights</text>
</g>
<g data-edge="cpu-ram">
<path d="M350 210 L350 270" fill="none" stroke="#3C4043" stroke-width="1.5"/>
<path d="M345 260 L350 270 L355 260" fill="none" stroke="#3C4043" stroke-width="1.5"/>
<rect x="285" y="232" width="130" height="17" fill="#FFFFFF"/>
<text x="350" y="245" text-anchor="middle" fill="#202124" font-size="12">counters, step tables</text>
</g>
<g data-edge="gpu-ram">
<path d="M115 210 L115 222 L224 222 L224 330 L250 330" fill="none" stroke="#3C4043" stroke-width="1.5"/>
<path d="M240 335 L250 330 L240 325" fill="none" stroke="#3C4043" stroke-width="1.5"/>
<rect x="135" y="214" width="90" height="17" fill="#FFFFFF"/>
<text x="180" y="227" text-anchor="middle" fill="#202124" font-size="12">210–238 GB/s</text>
</g>
</svg>
