<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 290" width="1110" height="290" font-family="Inter, sans-serif">
<g data-node="arena">
<path d="M920 57 L920 133 A80 7 0 0 0 1080 133 L1080 57 A80 7 0 0 0 920 57 Z" fill="#FEF7E0" stroke="#E37400" stroke-width="1"/>
<path d="M920 57 A80 7 0 0 0 1080 57" fill="none" stroke="#E37400" stroke-width="1"/>
<text x="1000" y="94" text-anchor="middle" fill="#202124" font-size="14">arena: N equal units</text>
<text x="1000" y="114" text-anchor="middle" fill="#202124" font-size="14">never move</text>
</g>
<g data-node="kernel">
<rect x="670" y="70" width="150" height="60" rx="8" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1"/>
<text x="745" y="95" text-anchor="middle" fill="#202124" font-size="14">GPU kernel</text>
<text x="745" y="115" text-anchor="middle" fill="#202124" font-size="14">slot × unit + offset</text>
</g>
<g data-node="req-a">
<rect x="10" y="160" width="190" height="100" fill="#FFFFFF" stroke="#3C4043" stroke-width="1"/>
<text x="105" y="183" text-anchor="middle" fill="#202124" font-size="14" font-weight="700">Request A</text>
<path d="M10 196 L200 196" stroke="#3C4043" stroke-width="1"/>
<text x="18" y="217" fill="#202124" font-size="14">pages</text>
<text x="192" y="217" text-anchor="end" fill="#202124" font-size="14">0, 3, 6, …</text>
<text x="18" y="241" fill="#202124" font-size="14">state</text>
<text x="192" y="241" text-anchor="end" fill="#202124" font-size="14">1, 4, … (50 units)</text>
</g>
<g data-node="req-b">
<rect x="30" y="20" width="170" height="100" fill="#FFFFFF" stroke="#3C4043" stroke-width="1"/>
<text x="115" y="43" text-anchor="middle" fill="#202124" font-size="14" font-weight="700">Request B</text>
<path d="M30 56 L200 56" stroke="#3C4043" stroke-width="1"/>
<text x="38" y="77" fill="#202124" font-size="14">pages</text>
<text x="192" y="77" text-anchor="end" fill="#202124" font-size="14">2, 9, …</text>
<text x="38" y="101" fill="#202124" font-size="14">state</text>
<text x="192" y="101" text-anchor="end" fill="#202124" font-size="14">5, … (50 units)</text>
</g>
<g data-node="table">
<rect x="300" y="10" width="270" height="170" fill="#FFFFFF" stroke="#3C4043" stroke-width="1"/>
<text x="435" y="33" text-anchor="middle" fill="#202124" font-size="14" font-weight="700">Step table</text>
<path d="M300 46 L570 46" stroke="#3C4043" stroke-width="1"/>
<text x="308" y="67" fill="#202124" font-size="14">rows</text>
<text x="562" y="67" text-anchor="end" fill="#202124" font-size="14">R</text>
<text x="308" y="91" fill="#202124" font-size="14">pos</text>
<text x="562" y="91" text-anchor="end" fill="#202124" font-size="14">first position, per row</text>
<text x="308" y="115" fill="#202124" font-size="14">n</text>
<text x="562" y="115" text-anchor="end" fill="#202124" font-size="14">tokens this step, per row</text>
<text x="308" y="139" fill="#202124" font-size="14">offsets</text>
<text x="562" y="139" text-anchor="end" fill="#202124" font-size="14">where each row's slots start</text>
<text x="308" y="163" fill="#202124" font-size="14">slots</text>
<text x="562" y="163" text-anchor="end" fill="#202124" font-size="14">page slots, then state slots</text>
</g>
<g data-edge="a-table">
<path d="M200 210 L280 210 L280 158 L300 158" fill="none" stroke="#3C4043" stroke-width="1.5"/>
<path d="M290 163 L300 158 L290 153" fill="none" stroke="#3C4043" stroke-width="1.5"/>
</g>
<g data-edge="b-table">
<path d="M200 70 L280 70 L280 158 L300 158" fill="none" stroke="#3C4043" stroke-width="1.5"/>
<path d="M290 163 L300 158 L290 153" fill="none" stroke="#3C4043" stroke-width="1.5"/>
</g>
<g data-edge="kernel-arena">
<path d="M820 98 L920 98" fill="none" stroke="#3C4043" stroke-width="1.5"/>
<path d="M910 103 L920 98 L910 93" fill="none" stroke="#3C4043" stroke-width="1.5"/>
</g>
<g data-edge="table-kernel">
<path d="M570 98 L670 98" fill="none" stroke="#3C4043" stroke-width="1.5"/>
<path d="M660 103 L670 98 L660 93" fill="none" stroke="#3C4043" stroke-width="1.5"/>
<rect x="585" y="90" width="70" height="17" fill="#FFFFFF"/>
<text x="620" y="103" text-anchor="middle" fill="#202124" font-size="12">GPU reads</text>
</g>
</svg>
