<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 -10 470 540" width="470" height="540" font-family="Inter, sans-serif">
<g data-node="cache-only">
<rect x="60" y="330" width="210" height="60" rx="8" fill="#FFFFFF" stroke="#3C4043" stroke-width="1"/>
<text x="165" y="355" text-anchor="middle" fill="#202124" font-size="14">cache-only</text>
<text x="165" y="375" text-anchor="middle" fill="#202124" font-size="14">req_refs = 0, cache_refs &gt; 0</text>
</g>
<g data-node="free">
<rect x="60" y="90" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#3C4043" stroke-width="1"/>
<text x="140" y="115" text-anchor="middle" fill="#202124" font-size="14">free</text>
<text x="140" y="135" text-anchor="middle" fill="#202124" font-size="14">bit set in the bitmap</text>
</g>
<g data-node="live">
<rect x="110" y="210" width="110" height="60" rx="8" fill="#FFFFFF" stroke="#3C4043" stroke-width="1"/>
<text x="165" y="235" text-anchor="middle" fill="#202124" font-size="14">live</text>
<text x="165" y="255" text-anchor="middle" fill="#202124" font-size="14">req_refs &gt; 0</text>
</g>
<g data-node="pending">
<rect x="10" y="450" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#3C4043" stroke-width="1"/>
<text x="110" y="475" text-anchor="middle" fill="#202124" font-size="14">pending (slot, step)</text>
<text x="110" y="495" text-anchor="middle" fill="#202124" font-size="14">no refs; GPU may still read</text>
</g>
<g data-node="start">
<circle cx="140" cy="20" r="10" fill="#202124" stroke="#3C4043" stroke-width="1"/>
</g>
<g data-edge="alloc">
<path d="M140 150 L140 162 L165 162 L165 210" fill="none" stroke="#3C4043" stroke-width="1.5"/>
<path d="M160 200 L165 210 L170 200" fill="none" stroke="#3C4043" stroke-width="1.5"/>
<rect x="85" y="159" width="160" height="17" fill="#FFFFFF"/>
<text x="165" y="172" text-anchor="middle" fill="#202124" font-size="12">alloc (from a reservation)</text>
</g>
<g data-edge="evict">
<path d="M165 390 L165 438 L110 438 L110 450" fill="none" stroke="#3C4043" stroke-width="1.5"/>
<path d="M105 440 L110 450 L115 440" fill="none" stroke="#3C4043" stroke-width="1.5"/>
<rect x="131" y="430" width="50" height="17" fill="#FFFFFF"/>
<text x="156" y="443" text-anchor="middle" fill="#202124" font-size="12">evicted</text>
</g>
<g data-edge="hit">
<path d="M138 330 L138 270" fill="none" stroke="#3C4043" stroke-width="1.5"/>
<path d="M143 280 L138 270 L133 280" fill="none" stroke="#3C4043" stroke-width="1.5"/>
<rect x="24" y="292" width="110" height="17" fill="#FFFFFF"/>
<text x="79" y="305" text-anchor="middle" fill="#202124" font-size="12">a cache hit refs it</text>
</g>
<g data-edge="release">
<path d="M110 240 L-2 240 L-2 480 L10 480" fill="none" stroke="#3C4043" stroke-width="1.5"/>
<path d="M0 485 L10 480 L0 475" fill="none" stroke="#3C4043" stroke-width="1.5"/>
<rect x="-52" y="265" width="100" height="17" fill="#FFFFFF"/>
<text x="-2" y="278" text-anchor="middle" fill="#202124" font-size="12">last ref dropped</text>
</g>
<g data-edge="retire">
<path d="M210 480 L280 480 L280 120 L220 120" fill="none" stroke="#3C4043" stroke-width="1.5"/>
<path d="M230 115 L220 120 L230 125" fill="none" stroke="#3C4043" stroke-width="1.5"/>
<rect x="205" y="395" width="150" height="17" fill="#FFFFFF"/>
<text x="280" y="408" text-anchor="middle" fill="#202124" font-size="12">GPU event passed step</text>
</g>
<g data-edge="start-free">
<path d="M140 30 L140 90" fill="none" stroke="#3C4043" stroke-width="1.5"/>
<path d="M135 80 L140 90 L145 80" fill="none" stroke="#3C4043" stroke-width="1.5"/>
</g>
<g data-edge="to-cache">
<path d="M192 270 L192 330" fill="none" stroke="#3C4043" stroke-width="1.5"/>
<path d="M187 320 L192 330 L197 320" fill="none" stroke="#3C4043" stroke-width="1.5"/>
<rect x="196" y="292" width="170" height="17" fill="#FFFFFF"/>
<text x="281" y="305" text-anchor="middle" fill="#202124" font-size="12">request ends, cache holds it</text>
</g>
</svg>
