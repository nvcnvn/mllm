[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mmmllm"
version = "0.4.0rc1"
description = "my mac mini llm: a C++/Metal LLM serving engine for Apple silicon Macs (M1-M4), bit-exact with mlx-lm"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["huggingface_hub>=0.24"]

[project.optional-dependencies]
compare = ["mlx-lm==0.32.2", "mlx==0.32.4"]  # `mmmllm compare`: the baseline; mlx = the version src/vendor/mlx copies
# `--prefill ane` builds its Core ML blocks with these (py/mmmllm/ane.py); coremltools has wheels up to Python 3.13
# (3.14 gets a source build without its compiler), so uvx needs `--python 3.13` where 3.14 is the default
ane = ["coremltools==9.0; python_version < '3.14'", "numpy>=2,<2.6; python_version < '3.14'"]  # tested: 2.5.5

[project.urls]
Source = "https://github.com/nvcnvn/mmmllm"

[project.scripts]
mmmllm = "mmmllm:main"

[tool.setuptools]
package-dir = { "" = "py" }
packages = ["mmmllm"]
