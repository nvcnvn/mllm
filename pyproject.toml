[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mmmllm"
version = "0.2.0"
description = "my mac mini llm: a C++/Metal LLM serving engine for Apple M4 Macs"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["huggingface_hub>=0.24"]

[project.optional-dependencies]
compare = ["mlx-lm==0.32.2"]  # `mmmllm compare`: the baseline it measures against

[project.urls]
Source = "https://github.com/nvcnvn/mmmllm"

[project.scripts]
mmmllm = "mmmllm:main"

[tool.setuptools]
package-dir = { "" = "py" }
packages = ["mmmllm"]
